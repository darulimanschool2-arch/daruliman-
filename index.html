<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#142B4A">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reer Kulmiye Cali – Lacagta Qaraanka</title>
<style>
/* =====================================================================
   MIDABADA — LIGHT (default)
   Qiimayaasha qoraalka waxay ka gudbaan WCAG AA (4.5:1)
   ===================================================================== */
:root{
  color-scheme:light;
  --navy:#142B4A; --navy-dark:#0B1F36; --navy-2:#244B70;
  --teal:#16A6A1; --bg:#F3F6FA; --card:#FFFFFF;
  --tx:#18283B; --mu:#556579; --br:#B6C3D4;
  --ok:#11704D; --ok-bg:#E6F4EE;
  --warn:#8A5A00; --warn-bg:#FBF3E2; --warn-dot:#D69A27;
  --bad:#BF2F2F; --bad-bg:#FBE9E9;

  /* Doorsoomayaal cusub (bedelaya :root[data-theme=dark] ... rules-kii hore) */
  --h2:#142B4A;
  --nav-on:#142B4A;
  --teal-tx:#0B7F7B;
  --btn:#142B4A; --btn-tx:#FFFFFF; --btn-s-tx:#142B4A;
  --btn-teal:#0E7C78; --btn-wa:#0B7A6E;
  --th-bg:#F3F6FA;
  --bar-from:#142B4A;

  --shadow:0 1px 3px rgba(20,43,74,.10),0 4px 12px rgba(20,43,74,.08);
  --shadow-lg:0 8px 32px rgba(20,43,74,.18);
  --radius:12px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}

/* DARK — system-ka taleefanka (hadduu isticmaalaha gacanta u dooran light) */
@media(prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    color-scheme:dark;
    --navy:#16263D; --navy-dark:#0A1420; --navy-2:#1E3A5C;
    --bg:#0B1622; --card:#1A2A3E;
    --tx:#FFFFFF; --mu:#C3D3E5; --br:#3E5A7A;
    --ok:#4BE0A8; --ok-bg:#123528;
    --warn:#FFC857; --warn-bg:#3A2D0F; --warn-dot:#FFC857;
    --bad:#FF8585; --bad-bg:#3F1C1C;

    --h2:#4FD1CB;
    --nav-on:#4FD1CB;
    --teal-tx:#4FD1CB;
    --btn:#2F6FA8; --btn-tx:#FFFFFF; --btn-s-tx:#FFFFFF;
    --btn-teal:#14938E; --btn-wa:#128C7E;
    --th-bg:#0A1420;
    --bar-from:#2F6FA8;

    --shadow:0 1px 3px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.4);
    --shadow-lg:0 8px 32px rgba(0,0,0,.5);
  }
}

/* DARK — marka gacanta lagu dooro data-theme=dark */
:root[data-theme=dark]{
  color-scheme:dark;
  --navy:#16263D; --navy-dark:#0A1420; --navy-2:#1E3A5C;
  --bg:#0B1622; --card:#1A2A3E;
  --tx:#FFFFFF; --mu:#C3D3E5; --br:#3E5A7A;
  --ok:#4BE0A8; --ok-bg:#123528;
  --warn:#FFC857; --warn-bg:#3A2D0F; --warn-dot:#FFC857;
  --bad:#FF8585; --bad-bg:#3F1C1C;

  --h2:#4FD1CB;
  --nav-on:#4FD1CB;
  --teal-tx:#4FD1CB;
  --btn:#2F6FA8; --btn-tx:#FFFFFF; --btn-s-tx:#FFFFFF;
  --btn-teal:#14938E; --btn-wa:#128C7E;
  --th-bg:#0A1420;
  --bar-from:#2F6FA8;

  --shadow:0 1px 3px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.4);
  --shadow-lg:0 8px 32px rgba(0,0,0,.5);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--safe-top);
  background:var(--navy);z-index:10;pointer-events:none}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
a{color:var(--teal-tx)}
small{color:var(--mu)}

header{background:var(--navy);color:#fff;padding:calc(12px + var(--safe-top)) 16px 14px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.15);position:sticky;top:0;z-index:8}
header h1{font-size:16px;line-height:1.2}
header small{color:#BFD1E5;font-size:11px;display:block;margin-top:2px}
.hdr-actions{display:flex;gap:6px}
.icon-btn{background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:9px;
  width:38px;height:38px;font-size:16px;cursor:pointer;display:flex;
  align-items:center;justify-content:center;transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,.22)}

main{padding:16px 14px calc(92px + var(--safe-bot));max-width:1080px;margin:0 auto}

nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid var(--br);display:flex;
  padding:6px 4px calc(6px + var(--safe-bot));z-index:7;box-shadow:0 -2px 8px rgba(0,0,0,.06)}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:11px;
  padding:6px 0;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:2px;font-weight:600;border-radius:8px;transition:color .15s}
nav button span{font-size:20px;line-height:1}
nav button.on{color:var(--nav-on)}
nav button:hover{color:var(--nav-on)}

.g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.g{grid-template-columns:repeat(4,1fr)}}
.c{background:var(--card);border:1px solid var(--br);border-radius:var(--radius);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow);
  transition:border-color .15s,box-shadow .15s}
.c:hover{border-color:var(--navy-2)}
.c.k{padding:14px}
.c.k small{font-size:12px;font-weight:700;color:var(--mu);
  text-transform:uppercase;letter-spacing:.03em}
.c.k b{display:block;font-size:22px;margin-top:6px;color:var(--tx);
  font-weight:800;letter-spacing:-.02em}

/* HERO CARD — gradient-ku wuxuu ku dhammaadaa midab mugdi ah si qoraalka cad u muuqdo */
.hero{background:linear-gradient(135deg,#142B4A 0%,#244B70 65%,#1A6F7A 100%);
  color:#fff;border-radius:20px;padding:24px 22px;margin-bottom:16px;
  box-shadow:var(--shadow-lg);position:relative;overflow:hidden;
  display:flex;align-items:center;gap:18px}
.hero::before{content:"";position:absolute;right:-40px;top:-40px;
  width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.06);pointer-events:none}
.hero::after{content:"";position:absolute;right:-80px;bottom:-80px;
  width:220px;height:220px;border-radius:50%;
  background:rgba(255,255,255,.04);pointer-events:none}
.hero-icon{font-size:52px;line-height:1;flex-shrink:0;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.3))}
.hero-body{flex:1;min-width:0;position:relative;z-index:1}
.hero-label{font-size:13px;font-weight:700;color:#E6F0FA;
  text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.hero-amount{font-size:42px;font-weight:900;color:#fff;line-height:1.05;
  letter-spacing:-.03em;word-break:break-word;
  text-shadow:0 2px 8px rgba(0,0,0,.25);
  font-variant-numeric:tabular-nums}
.hero-amount.neg{color:#FFD1D1}
.hero-sub{font-size:12px;color:#E3EEF8;margin-top:8px;font-weight:500}
.hero-badge{display:inline-block;background:rgba(255,255,255,.18);
  color:#fff;font-size:11px;font-weight:700;padding:4px 10px;
  border-radius:999px;margin-top:8px;letter-spacing:.02em}
@media(max-width:420px){
  .hero{padding:20px 18px;gap:14px;border-radius:16px}
  .hero-icon{font-size:40px}
  .hero-amount{font-size:34px}
  .hero-label{font-size:11px}
}
@media(min-width:640px){
  .hero{padding:28px 28px}
  .hero-amount{font-size:52px}
  .hero-icon{font-size:64px}
}

h2{font-size:15px;margin:18px 2px 10px;color:var(--h2)}

.ok{color:var(--ok)!important}.bad{color:var(--bad)!important}
.warn{color:var(--warn)!important}.navy{color:var(--navy)!important}
.teal{color:var(--teal-tx)!important}

.bar{height:9px;background:var(--br);border-radius:9px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--bar-from),var(--teal));
  border-radius:9px;transition:width .4s}
.mrow{display:grid;grid-template-columns:44px 1fr 52px;gap:10px;
  align-items:center;font-size:13px;margin:8px 0}
.mrow b{text-align:right;font-variant-numeric:tabular-nums;
  font-weight:700;color:var(--tx)}

.row{display:flex;justify-content:space-between;align-items:flex-start;
  gap:10px;padding:11px 0;border-bottom:1px solid var(--br);font-size:14px}
.row:last-child{border:0}
.row b{font-variant-numeric:tabular-nums;font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:10px;padding:3px 7px;border-radius:8px;
  background:var(--br);color:var(--tx);font-weight:700}
.chip.p{background:var(--ok-bg);color:var(--ok)}
.chip.m{background:var(--bad-bg);color:var(--bad)}
.chip.h{background:var(--warn-bg);color:var(--warn)}
.chip.f{background:transparent;border:1px dashed var(--mu);color:var(--mu)}

input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--br);
  border-radius:10px;background:var(--card);color:var(--tx);
  font:inherit;font-size:15px;margin:4px 0 12px;transition:border-color .15s}
input::placeholder,textarea::placeholder{color:var(--mu);opacity:.8}
select option{background:var(--card);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-2);
  box-shadow:0 0 0 3px rgba(36,75,112,.25)}
label{font-size:12px;font-weight:600;color:var(--mu);
  display:block;margin-top:4px;letter-spacing:.01em}

.btn{background:var(--btn);color:var(--btn-tx);border:0;border-radius:10px;
  padding:11px 16px;font-size:14px;cursor:pointer;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  transition:opacity .15s,transform .05s;min-height:44px}
.btn:hover{opacity:.9}.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.s{background:var(--bg);color:var(--btn-s-tx);border:1px solid var(--br)}
.btn.d{background:var(--bad-bg);color:var(--bad)}
.btn.wa{background:var(--btn-wa);color:#fff}
.btn.teal{background:var(--btn-teal);color:#fff}
.btn.w{width:100%}
.act-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
@media(max-width:380px){.act-grid{grid-template-columns:1fr}}

.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:1px solid var(--br);background:var(--card);color:var(--tx);
  border-radius:20px;padding:8px 14px;font-size:13px;white-space:nowrap;
  font-weight:600;cursor:pointer;transition:all .15s}
.tabs button.on{background:var(--btn);color:var(--btn-tx);border-color:var(--btn)}

.top{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.top input,.top select{margin:0;flex:1;min-width:140px}

.md{position:fixed;inset:0;background:rgba(11,31,54,.55);z-index:20;
  display:none;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px)}
.md.on{display:flex}
.md>div{background:var(--card);width:100%;max-width:560px;max-height:92vh;
  overflow:auto;border-radius:20px 20px 0 0;
  padding:20px 16px calc(20px + var(--safe-bot));
  box-shadow:0 -8px 32px rgba(0,0,0,.25);animation:slideUp .2s ease}
@keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.md h2{margin-top:0;margin-bottom:14px;color:var(--h2)}

.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pg label{margin:0 0 2px;font-size:10px}
.pg input{margin:0;padding:8px;font-size:13px}

.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:520px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--br);
  white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;font-weight:600}
th{color:var(--mu);font-weight:700;font-size:11px;text-transform:uppercase;
  letter-spacing:.04em;background:var(--th-bg);position:sticky;top:0}
tr:hover td{background:rgba(22,166,161,.06)}

.fab{position:fixed;right:16px;bottom:calc(80px + var(--safe-bot));
  width:56px;height:56px;border-radius:28px;font-size:26px;
  background:var(--btn);color:var(--btn-tx);border:0;
  box-shadow:0 6px 20px rgba(20,43,74,.35);z-index:6;display:none;
  cursor:pointer;transition:transform .1s}
.fab:hover{transform:scale(1.05)}.fab:active{transform:scale(.95)}

.st{font-size:11px;color:var(--mu);text-align:center;margin-top:16px;
  line-height:1.6}
.status-bar{display:flex;align-items:center;gap:6px;font-size:11px;
  color:var(--mu);margin-bottom:10px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.dot.off{background:var(--bad);box-shadow:0 0 0 3px var(--bad-bg)}
.dot.warn{background:var(--warn-dot)}
.toast{position:fixed;left:50%;top:calc(72px + var(--safe-top));
  transform:translateX(-50%) translateY(-10px);background:var(--navy-dark);
  color:#fff;padding:10px 18px;border-radius:22px;z-index:30;font-size:13px;
  opacity:0;transition:all .25s;pointer-events:none;font-weight:600;
  border:1px solid rgba(255,255,255,.25);
  box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

.p-card{background:linear-gradient(140deg,var(--navy) 0%,var(--navy-2) 100%);
  color:#fff;border-radius:16px;padding:20px;margin-bottom:12px;
  box-shadow:var(--shadow-lg)}
.p-card small{opacity:.85;display:block;font-size:12px;color:#BFD1E5}
.p-card h3{margin:6px 0 4px;font-size:22px;color:#fff}
.p-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.p-box{background:rgba(255,255,255,.14);border-radius:10px;padding:12px}
.p-box small{font-size:10px;opacity:.9;text-transform:uppercase;
  letter-spacing:.04em;color:#D6E6F5}
.p-box b{font-size:17px;display:block;margin-top:3px;color:#fff;
  font-variant-numeric:tabular-nums;font-weight:800}
.list-pill{display:inline-block;padding:5px 10px;border-radius:999px;
  font-size:12px;margin:3px 4px 0 0;font-weight:700}
.list-pill.ok{background:var(--ok-bg);color:var(--ok)}
.list-pill.bad{background:var(--bad-bg);color:var(--bad)}

.modebar{background:var(--warn-bg);color:var(--warn);border:1px solid var(--br);
  border-radius:10px;padding:9px 12px;font-size:12px;margin-bottom:12px;
  display:flex;justify-content:space-between;align-items:center;gap:8px;
  flex-wrap:wrap;font-weight:700}
.modebar.on{background:var(--ok-bg);color:var(--ok)}

.pw-wrap{position:relative;margin:4px 0 12px}
.pw-wrap input{margin:0;padding-right:52px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  background:transparent;border:0;font-size:20px;cursor:pointer;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  color:var(--mu);border-radius:8px}
.pw-eye:hover{background:var(--bg)}
.pw-clear{position:absolute;right:44px;top:50%;transform:translateY(-50%);
  background:transparent;border:0;font-size:16px;cursor:pointer;
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  color:var(--mu);border-radius:8px}
.pw-clear:hover{background:var(--bg)}

@media print{
  :root{color-scheme:light}
  header,nav,.fab,.modebar,.tabs,.no-print,.st,.status-bar,.toast,.icon-btn,
  .act-grid,#fab,.hero{display:none!important}
  body{background:#fff;color:#000}
  main{padding:0;max-width:100%}
  .c,.p-card{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .p-card{background:#142B4A!important;-webkit-print-color-adjust:exact;
    print-color-adjust:exact}
  table{min-width:0}
  th{background:#f0f0f0!important}
}
</style>
</head>
<body>

<header>
  <div>
    <h1>Reer Kulmiye Cali</h1>
    <small id="sub">Lacagta Qaraanka · 2026</small>
  </div>
  <div class="hdr-actions">
    <button class="icon-btn" id="rf" title="Cusboonaysii">↻</button>
    <button class="icon-btn" id="lk" title="Xidh/Fur">🔒</button>
  </div>
</header>

<main id="v"></main>
<button class="fab" id="fab">+</button>
<nav id="nv"></nav>
<div class="md" id="md"><div id="mc"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   REER KULMIYE CALI
   ===================================================================== */

const DEFAULT_API="https://script.google.com/macros/s/AKfycbw8kKEosj8EkV458_D2_f6C7oeMRLWMrBbNdowmo0aW8-pRtSH2Raen3EvWNVwqtRnnuA/exec";
const MN=["Apr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dec"];
const GROUPS=["Maxamuud Kulmiye","Xasan Kulmiye","Axmed Kulmiye"];
const YEAR=2026;

let S={m:[],t:[],x:[]};
let tab="d", unlocked=false, q="", grpFilter="", selPersonIdx=0;
let doc=null, tmr=null, sub="s";
let API=localStorage.getItem("kul_api")||DEFAULT_API;
let PW="", stamp="", syncState="init", syncErr="";
let busy=false;
let pdfLibs=null;

const now=new Date();
const yrNow=now.getFullYear();
const mNow=now.getMonth()+1;
const cur = yrNow>YEAR ? 9 : Math.min(9, Math.max(0, mNow-4));
const billedLabel = cur===0 ? "Weli bil lama dallacin" : `Apr–${MN[cur-1]}`;

const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
const f=n=>(+n||0).toLocaleString("en-US");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const td=()=>new Date().toISOString().slice(0,10);
const todayLong=()=>new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"});
const fmtMoney=n=>"$"+(+n||0).toLocaleString("en-US",{minimumFractionDigits:0,maximumFractionDigits:2});
const fmtPct=(a,b)=>b>0?Math.round(a/b*100)+"%":"0%";

function toast(msg,ms=2200){
  const t=$("#toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),ms);
}
function setSync(state,err){
  syncState=state; syncErr=err||"";
  stamp = state==="ok" ? new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) : stamp;
}

function normalizeData(j){
  if(Array.isArray(j.m)||Array.isArray(j.t)){
    return {m:j.m||[], t:j.t||[], x:j.x||[]};
  }
  const r=Array.isArray(j.r)?j.r:[];
  const x=Array.isArray(j.x)?j.x:[];
  const m=[], t=[];
  r.forEach(item=>{
    if(Array.isArray(item.p)){
      m.push({r:item.r, n:item.n||"", g:item.g||"", d:+item.d||0,
        p:item.p.slice(0,9).map(v=>+v||0).concat(Array(Math.max(0,9-item.p.length)).fill(0))});
    } else if(item.c||item.a||item.w){
      t.push({r:item.r, d:item.d||"", b:item.b||"", c:item.c||"",
        w:item.w||"", a:+item.a||0, nb:item.nb||"", auto:!!item.auto});
    }
  });
  return {m,t,x};
}

function detectCellChanges(prevM,nextM,existingT){
  const added=[]; const todayStr=td();
  const prevMap=new Map();
  (prevM||[]).forEach((it,idx)=>{
    const key=(it.r!==undefined&&it.r!==null)?String(it.r):(it.n+"|"+idx);
    prevMap.set(key,it);
  });
  (nextM||[]).forEach((it,idx)=>{
    const key=(it.r!==undefined&&it.r!==null)?String(it.r):(it.n+"|"+idx);
    const old=prevMap.get(key);
    const oldP=old&&Array.isArray(old.p)?old.p:Array(9).fill(0);
    const newP=Array.isArray(it.p)?it.p:Array(9).fill(0);
    for(let k=0;k<9;k++){
      const before=+oldP[k]||0, after=+newP[k]||0;
      if(after>before){
        const diff=after-before;
        const dup=(existingT||[]).some(t=>
          String(t.w||"").toLowerCase().includes(String(it.n||"").toLowerCase()) &&
          String(t.b||"").toLowerCase()===MN[k].toLowerCase() &&
          (+t.a===after||+t.a===diff));
        if(!dup) added.push({d:todayStr,b:MN[k],c:it.g||"Sheet Update",
          w:it.n||"Xubin",a:diff,
          nb:before===0?`Unug madhnaa -> $${after}`:`Kordhay $${before} -> $${after}`,
          auto:true});
      }
    }
  });
  return added;
}

const paid   = m => (m.p||[]).reduce((a,b)=>a+(+b||0),0);
const paidTo = (m,k=cur) => (m.p||[]).slice(0,k).reduce((a,b)=>a+(+b||0),0);
const owed   = m => { const l=[]; for(let i=0;i<cur;i++) if((+m.p[i]||0) < (+m.d||0)) l.push(i); return l; };
const owedAmt= m => owed(m).reduce((a,k)=>a+((+m.d||0)-(+m.p[k]||0)),0);

function T(){
  const R=S.m.reduce((a,m)=>a+(+m.d||0),0);
  const yr=R*9;
  const dn=R*cur;
  const pd=S.m.reduce((a,m)=>a+paid(m),0);
  const pdn=S.m.reduce((a,m)=>a+paidTo(m),0);
  const ex=S.x.reduce((a,x)=>a+(+x.a||0),0);
  const lg=S.t.reduce((a,t)=>a+(+t.a||0),0);
  return {R,yr,dn,pd,pdn,miss:Math.max(0,dn-pdn),ex,lg,hand:pd-ex};
}
function mon(i){
  const R=S.m.reduce((a,m)=>a+(+m.d||0),0);
  const pd=S.m.reduce((a,m)=>a+(+m.p[i]||0),0);
  const n=S.m.filter(m=>(+m.p[i]||0)>=(+m.d||0)&&(+m.d||0)>0).length;
  return {R,pd,miss:Math.max(0,R-pd),n,pc:R?Math.round(pd/R*100):0};
}
function collectorsSummary(){
  const o={};
  S.t.forEach(t=>{const k=t.c||"—"; o[k]=o[k]||{total:0,count:0}; o[k].total+=(+t.a||0); o[k].count++;});
  return Object.entries(o).sort((a,b)=>b[1].total-a[1].total);
}
function membersStats(){
  return S.m.map((m,i)=>({m,i,o:owed(m),amt:owedAmt(m),pd:paid(m)})).sort((a,b)=>b.amt-a.amt);
}

function ask(cb){
  md(`<h2>Geli Password-ka Edit-ka</h2>

      <input id="pw" type="password" placeholder="Password" autocomplete="off"
        autofocus inputmode="text">

      <button type="button" class="pw-eye" id="eye" title="Muuji/Qari">👁</button>
    </div>
    <button class="btn w" id="go">Fur Edit</button>
    <p class="bad" id="er" style="min-height:18px;margin-top:8px"></p>
    <button class="btn s w" id="cx" style="margin-top:6px">Ka noqo</button>`);

  const input=$("#pw");
  const eye=$("#eye");
  const clr=$("#clr");
  const goBtn=$("#go");

  eye.onclick=()=>{
    const isPw=input.type==="password";
    input.type=isPw?"text":"password";
    eye.textContent=isPw?"🙈":"👁";
    input.focus();
  };
  clr.onclick=()=>{ input.value=""; input.focus(); };
  $("#cx").onclick=()=>{ close(); };

  const go=async()=>{
    const p=input.value;
    if(!p){ $("#er").textContent="Password geli"; input.focus(); return; }
    $("#er").textContent="…"; goBtn.disabled=true;
    try{
      const r=await fetch(API,{method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify({pass:p,op:"check"})});
      const j=await r.json();
      if(j.error) throw j.error;
      PW=p; unlocked=true; lock(); close(); render(); cb&&cb();
    }catch(e){
      $("#er").textContent="Password khaldan ama xiriir ma jiro";
      input.select();
    }
    finally{ goBtn.disabled=false; }
  };
  goBtn.onclick=go;
  input.onkeydown=e=>{
    if(e.key==="Enter"){ e.preventDefault(); go(); }
    if(e.key==="Escape"){ e.preventDefault(); close(); }
  };
  setTimeout(()=>{ try{ input.focus(); input.select(); }catch(e){} },60);
}

    `Maqan (${billedLabel}): ${fmtMoney(t.miss)}\n`+
    `Qabasho: ${fmtPct(t.pdn,t.dn)}`;

function loadPdfLibs(){
  if(pdfLibs) return Promise.resolve(pdfLibs);
  if(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable){
    return Promise.resolve(pdfLibs = {jsPDF: window.jspdf.jsPDF});
  }
  const load = (src)=>new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src=src; s.onload=res; s.onerror=()=>rej(new Error("CDN lama soo dejisan karin"));
    document.head.appendChild(s);
  });
  return load("https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js")
    .then(()=>load("https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"))
    .then(()=>{
      if(!(window.jspdf&&window.jspdf.jsPDF&&window.jspdf.jsPDF.API.autoTable))
        throw new Error("AutoTable lama helin");
      pdfLibs = {jsPDF: window.jspdf.jsPDF};
      return pdfLibs;
    });
}

function buildPdfDoc(reportKey){
  return loadPdfLibs().then(({jsPDF})=>{
    const t=T();
    const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent)
                     || window.innerWidth < 700;
    const wideReports = ["b","p","c"];
    const useLandscape = isMobile && wideReports.includes(reportKey);
    const orientation = useLandscape ? "landscape" : "portrait";

    const doc=new jsPDF({orientation, unit:"mm", format:"a4", compress:true});
    const W=doc.internal.pageSize.getWidth();
    const margin = isMobile ? 8 : 14;
    const baseFont = isMobile ? 11 : 8.5;
    const headFont = isMobile ? 11 : 8.5;
    const titleFont = isMobile ? 16 : 13;

    const titles={s:"Warbixin Shaqsi",b:"Warbixin Bil-bil",p:"Warbixin Xubnaha",c:"Warbixin Qabeyaasha",g:"Warbixin Guud"};
    const title=titles[reportKey]||"Warbixin";

    doc.setFillColor(20,43,74);
    doc.rect(0,0,W,isMobile?30:26,"F");
    doc.setTextColor(255,255,255);
    doc.setFont("helvetica","bold"); doc.setFontSize(isMobile?16:14);
    doc.text("Reer Kulmiye Cali", margin, isMobile?12:11);
    doc.setFont("helvetica","normal"); doc.setFontSize(isMobile?10:9);
    doc.text(`Warbixin: ${title} · Sanadka ${YEAR} · Xilliga: ${billedLabel}`,
      margin, isMobile?20:17);
    doc.text(`Taariikhda: ${todayLong()}`, W-margin, isMobile?20:17, {align:"right"});

    let y = isMobile ? 38 : 32;
    doc.setTextColor(24,40,59);

    doc.setFont("helvetica","bold"); doc.setFontSize(titleFont);
    doc.text(title.toUpperCase(), margin, y); y+=3;
    doc.setDrawColor(22,166,161); doc.setLineWidth(.7);
    doc.line(margin,y,margin+38,y); y += isMobile?9:7;

    const addTable=(headers,rows,opts={})=>{
      doc.autoTable({
        startY:y, head:[headers], body:rows,
        margin:{left:margin,right:margin},
        styles:{
          fontSize: baseFont,
          cellPadding: isMobile?3:2,
          overflow:"linebreak",
          lineColor:[226,232,240], lineWidth:.1,
          textColor:[24,40,59],
          minCellHeight: isMobile?8:0,
        },
        headStyles:{
          fillColor:[20,43,74], textColor:[255,255,255],
          fontStyle:"bold", fontSize: headFont,
          cellPadding: isMobile?3:2,
        },
        alternateRowStyles:{fillColor:[243,246,250]},
        theme:"grid",
        ...opts,
        didDrawPage:(data)=>{
          const ph=doc.internal.pageSize.getHeight();
          doc.setFontSize(isMobile?9:8); doc.setTextColor(120,128,150);
          doc.text(`Reer Kulmiye Cali — ${title} — ${todayLong()}`,
            margin, ph-6);
          doc.text(`Bog ${data.pageNumber}`, W-margin, ph-6, {align:"right"});
        }
      });
      y=doc.lastAutoTable.finalY+6;
    };

    if(reportKey==="s"){
      const m=S.m[selPersonIdx]||S.m[0];
      if(m){
        const md=+m.d||0, yg=md*9, tp=paid(m), bo=owedAmt(m), yr=Math.max(0,yg-tp);
        doc.setFontSize(isMobile?13:10); doc.setFont("helvetica","bold");
        doc.text(`Magaca: ${m.n}`, margin, y); y+=isMobile?7:5;
        doc.setFont("helvetica","normal");
        y+=isMobile?3:2;
        addTable(
          ["Lagu talagalay","Qiimaha"],
          [
            ["Bishii", fmtMoney(md)],
            ["Sanadka (9 bil)", fmtMoney(yg)],
            ["La bixiyay", fmtMoney(tp)],
            [`Ku dhiman (${billedLabel})`, fmtMoney(bo)],
            ["Sanadka hadhay", fmtMoney(yr)],
          ],
          {columnStyles:{0:{fontStyle:"bold"},1:{halign:"right"}}}
        );
        const rows=MN.map((n,k)=>{
          const v=+m.p[k]||0;
          const billed=k<cur;
          const rem=billed?Math.max(0,md-v):0;
          const st=md>0&&v>=md?"OK":v>0?"Qayb":billed?"Maqan":"Weli lama dallacin";
          return [n, fmtMoney(md), fmtMoney(v), billed?fmtMoney(rem):"—", st];
        });
        addTable(["Bil","Laga rabo","La bixiyay","Ku dhiman","Xaalad"], rows);
      }
    }
    else if(reportKey==="b"){
      addTable(
        ["Bil","La rabo","La qabtay","Maqan","%","Bixiyey","Xaalad"],
        MN.map((n,i)=>{
          const o=mon(i);
          const fut=i>=cur;
          return [n, fmtMoney(o.R), fmtMoney(o.pd), fut?"—":fmtMoney(o.miss),
            fut?"—":o.pc+"%", fut?"—":`${o.n}/${S.m.length}`,
            fut?"Weli lama dallacin":o.miss>0?"Maqan":"OK"];
        }).concat([["TOTAL",fmtMoney(t.yr),fmtMoney(t.pd),fmtMoney(t.miss),
          fmtPct(t.pd,t.yr),"",""]])
      );
    }
    else if(reportKey==="p"){
      addTable(
        ["Magac","Bishii","La bixiyay","Maqan","Bilo","Xaalad"],
        membersStats().map(x=>[x.m.n,
          fmtMoney(x.m.d),fmtMoney(x.pd),fmtMoney(x.amt),x.o.length,
          x.o.length?"Maqan":"✓"])
      );
    }
    else if(reportKey==="c"){
      const rows=collectorsSummary();
      const tot=rows.reduce((a,r)=>a+r[1].total,0);
      addTable(
        ["Qabeye","Diiwaanno","Wadarta","%"],
        rows.map(([n,v])=>[n,v.count,fmtMoney(v.total),fmtPct(v.total,tot)])
          .concat([["TOTAL",S.t.length,fmtMoney(tot),"100%"]])
      );
    }
    else {
      addTable(
        ["Qodob","Qiimaha"],
        [
          ["Hadafka sanadka (9 bil)", fmtMoney(t.yr)],
          ["La bixiyay (grid)", fmtMoney(t.pd)],
          ["Qabasho diiwaan geliyay", fmtMoney(t.lg)],
          ["Farqi (grid − diiwaan)", fmtMoney(t.pd-t.lg)],
          ["Bixin", fmtMoney(t.ex)],
          ["Lacagta la hayo", fmtMoney(t.hand)],
          [`Maqan (${billedLabel})`, fmtMoney(t.miss)],
          ["Qabasho %", fmtPct(t.pdn,t.dn)],
        ],
        {columnStyles:{0:{fontStyle:"bold"},1:{halign:"right"}}}
      );
    }

    return doc;
  });
}

function pdfFilename(reportKey){
  const map={s:"Warbixin-Shaqsi",b:"Warbixin-Bil-bil",p:"Warbixin-Xubnaha",
    c:"Warbixin-Qabeyaasha",g:"Warbixin-Guud"};
  if(reportKey==="s"){
    const m=S.m[selPersonIdx];
    const name=(m?.n||"Shaqsi").replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-");
    return `Warbixin-Shaqsi-${name}-${YEAR}.pdf`;
  }
  return `${map[reportKey]}-${YEAR}.pdf`;
}

async function shareWhatsApp(reportKey){
  const text=waTextFor(reportKey);
  try{
    const doc=await buildPdfDoc(reportKey);
    const blob=doc.output("blob");
    const file=new File([blob],pdfFilename(reportKey),{type:"application/pdf"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],text,title:"Warbixin"});
      return;
    }
    doc.save(pdfFilename(reportKey));
    toast("PDF la soo dejiyay. Hadda WhatsApp ayaa furmaya — fadlan ku lifaaq PDF-ka.");
  }catch(e){
    toast("PDF lama abuuri karin — qoraalka oo kaliya ayaa la dirayaa");
  }
  const url="https://wa.me/?text="+encodeURIComponent(text);
  window.open(url,"_blank","noopener,noreferrer");
}

function openQuickCollection(editIdx){
  if(!S.m.length) return toast("Xubno kuma jiraan");
  const existing = editIdx>=0 ? S.t[editIdx] : null;

  let activeGrp="";
  let activeMemberIdx=0;
  if(existing && existing.w){
    const found=S.m.findIndex(m=>m.n.toLowerCase()===existing.w.toLowerCase());
    if(found>=0) activeMemberIdx=found;
  }

  const getMembers=(g)=>{
    const list=S.m.map((m,i)=>({m,i})).filter(x=>!g || (x.m.g||"").toLowerCase().includes(g.toLowerCase()));
    return list.length ? list : S.m.map((m,i)=>({m,i}));
  };
  const dueOptions=(member)=>{
    const opts=[];
    for(let k=0;k<9;k++){
      const pv=+member.p[k]||0, dv=+member.d||0;
      const rem=Math.max(0,dv-pv);
      if(rem>0) opts.push({k,name:MN[k],rem,pv,dv});
    }
    if(!opts.length){
      for(let k=0;k<9;k++) opts.push({k,name:MN[k],rem:+member.d||0,pv:+member.p[k]||0,dv:+member.d||0});
    }
    return opts;
  };

  function draw(chosenMonthIdx){
    const gList=getMembers(activeGrp);
    if(!gList.some(x=>x.i===activeMemberIdx)) activeMemberIdx=gList[0].i;
    const member=S.m[activeMemberIdx];
    const mOpts=dueOptions(member);
    const sel=mOpts.find(o=>o.k===chosenMonthIdx)||mOpts[0];
    const defaultAmt = existing ? existing.a : sel.rem;

    md(`<h2>${existing?"Wax ka beddel Qabasho":"Qabasho Cusub"}</h2>
      ${existing?`<div style="background:var(--warn-bg);color:var(--warn);padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:10px">Beddelidda waxay si sax ah u beddeli doontaa lacagta xubinta.</div>`:""}
      <label>Koox</label>
      <select id="qGrp">
        <option value="">Dhammaan</option>
        ${GROUPS.map(g=>`<option value="${esc(g)}" ${activeGrp===g?"selected":""}>${esc(g)}</option>`).join("")}
      </select>
      <label>Qofka</label>
      <select id="qMem">
        ${gList.map(({m:pm,i:idx})=>`<option value="${idx}" ${idx===activeMemberIdx?"selected":""}>${esc(pm.n)} · ${fmtMoney(pm.d)}</option>`).join("")}
      </select>
      <label>Bisha</label>
      <select id="qMon">
        ${mOpts.map(o=>`<option value="${o.k}" ${o.k===sel.k?"selected":""}>${o.name} · maqan ${fmtMoney(o.rem)} (bixiyay ${fmtMoney(o.pv)})</option>`).join("")}
      </select>
      <label>Lacagta ($)</label>
      <input id="qAmt" type="number" min="0" value="${defaultAmt}">
      <label>Taariikh</label>
      <input id="qDate" type="date" value="${esc(existing?existing.d:td())}">
      <label>Qofka soo aruuriyay</label>
      <input id="qCol" value="${esc(existing?existing.c:(activeGrp||member.g||""))}">
      <label>NB / Faahfaahin</label>
      <input id="qNb" value="${esc(existing?existing.nb:`${sel.name} (${member.n})`)}">
      <button class="btn w" id="qSave">Kaydi</button>
      ${existing?`<button class="btn d w" id="qDel" style="margin-top:8px">Tirtir</button>`:""}`);

    $("#qGrp").onchange=e=>{ activeGrp=e.target.value; draw(null); };
    $("#qMem").onchange=e=>{ activeMemberIdx=+e.target.value; draw(null); };
    $("#qMon").onchange=e=>{
      const k=+e.target.value;
      const o=mOpts.find(x=>x.k===k)||sel;
      $("#qAmt").value=o.rem;
      $("#qNb").value=`${o.name} (${member.n})`;
    };

    $("#qSave").onclick=()=>{
      if(busy) return;
      const k=+$("#qMon").value;
      const amt=Math.max(0,+$("#qAmt").value||0);
      const col=$("#qCol").value.trim()||"Qabasho";
      const d=$("#qDate").value||td();
      const nb=$("#qNb").value.trim();

      const applyMember = (mem, monthIdx, amount)=>{
        const copy=JSON.parse(JSON.stringify(mem));
        const prev=+copy.p[monthIdx]||0;
        copy.p[monthIdx]=Math.max(0, prev+amount);
        return copy;
      };

      const tRecord={ d, b:MN[k], c:col, w:member.n, a:amt, nb };

      if(existing){
        const oldMemberName = existing.w;
        const oldMonthIdx = MN.indexOf(existing.b);
        const oldAmt = +existing.a||0;
        const oldMemberIdx = S.m.findIndex(x=>x.n===oldMemberName);

        if(API){
          busy=true;
          const tasks=[];
          if(oldMemberIdx>=0 && oldMonthIdx>=0){
            const oldM=S.m[oldMemberIdx];
            const reversed=JSON.parse(JSON.stringify(oldM));
            reversed.p[oldMonthIdx]=Math.max(0,(+reversed.p[oldMonthIdx]||0)-oldAmt);
            tasks.push(op("saveMember",{r:oldM.r,...reversed},true));
          }
          const newM=S.m[activeMemberIdx];
          const applied=applyMember(newM,k,amt);
          tasks.push(op("saveMember",{r:newM.r,...applied},true));
          tasks.push(op("saveT",{r:existing.r,...tRecord},true));
          Promise.all(tasks).then(()=>{close();pull(true);}).finally(()=>busy=false);
          return;
        }
        if(oldMemberIdx>=0 && oldMonthIdx>=0){
          const oldM=S.m[oldMemberIdx];
          oldM.p[oldMonthIdx]=Math.max(0,(+oldM.p[oldMonthIdx]||0)-oldAmt);
        }
        S.m[activeMemberIdx]=applyMember(S.m[activeMemberIdx],k,amt);
        S.t[editIdx]={...existing,...tRecord};
        save();close();render();return;
      }

      if(API){
        busy=true;
        const newM=S.m[activeMemberIdx];
        const applied=applyMember(newM,k,amt);
        Promise.all([
          op("saveMember",{r:newM.r,...applied},true),
          op("saveT",{...tRecord},true)
        ]).then(()=>{close();pull(true);}).finally(()=>busy=false);
        return;
      }
      S.m[activeMemberIdx]=applyMember(S.m[activeMemberIdx],k,amt);
      S.t.push(tRecord);
      save();close();render();
    };

    if(existing && $("#qDel")){
      $("#qDel").onclick=()=>{
        if(!confirm("Tirtir diiwaankan? Lacagta xubinta waa la beddeli doonaa.")) return;
        const oldMemberIdx=S.m.findIndex(x=>x.n===existing.w);
        const oldMonthIdx=MN.indexOf(existing.b);
        const oldAmt=+existing.a||0;
        if(API){
          busy=true;
          const tasks=[];
          if(oldMemberIdx>=0 && oldMonthIdx>=0){
            const oldM=S.m[oldMemberIdx];
            const reversed=JSON.parse(JSON.stringify(oldM));
            reversed.p[oldMonthIdx]=Math.max(0,(+reversed.p[oldMonthIdx]||0)-oldAmt);
            tasks.push(op("saveMember",{r:oldM.r,...reversed},true));
          }
          tasks.push(op("delT",{r:existing.r},true));
          Promise.all(tasks).then(()=>{close();pull(true);}).finally(()=>busy=false);
          return;
        }
        if(oldMemberIdx>=0 && oldMonthIdx>=0){
          S.m[oldMemberIdx].p[oldMonthIdx]=Math.max(0,(+S.m[oldMemberIdx].p[oldMonthIdx]||0)-oldAmt);
        }
        S.t.splice(editIdx,1);save();close();render();
      };
    }
  }
  draw(null);
}

function ex(i){
  const x=i<0?{d:td(),a:"",s:"",to:"",by:"",nb:""}:S.x[i];
  md(`<h2>${i<0?"Bixin Cusub":"Wax ka beddel Bixin"}</h2>
    <label>Taariikh</label><input id="a" type="date" value="${esc(x.d)}">
    <label>Lacagta ($)</label><input id="b" type="number" min="0" value="${x.a}">
    <label>Sababta</label><input id="c" value="${esc(x.s)}">
    <label>Qofka loo tuuray</label><input id="e" value="${esc(x.to)}">
    <label>Qofka bixiyey</label><input id="f" value="${esc(x.by)}">
    <label>Faahfaahin</label><input id="n" value="${esc(x.nb)}">
    <button class="btn w" id="sv">Kaydi</button>
    ${i>=0?`<button class="btn d w" id="dl" style="margin-top:8px">Tirtir</button>`:""}`);
  $("#sv").onclick=()=>{
    if(busy) return;
    const o={d:$("#a").value,a:Math.max(0,+$("#b").value||0),s:$("#c").value.trim(),
      to:$("#e").value.trim(),by:$("#f").value.trim(),nb:$("#n").value};
    if(!o.a) return toast("Lacag geli");
    busy=true;
    if(API) return op("saveX",{r:x.r,...o}).finally(()=>busy=false);
    i<0?S.x.push(o):S.x[i]=o;save();close();render();busy=false;
  };
  if(i>=0) $("#dl").onclick=()=>{
    if(!confirm("Tirtir bixintan?")) return;
    if(API) return op("delX",{r:x.r});
    S.x.splice(i,1);save();close();render();
  };
}

async function op(name,data,silent){
  const t=$("#toast"); if(!silent){t.textContent="Waa la kaydinayaa…";t.classList.add("on");}
  try{
    const r=await fetch(API,{method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({pass:PW,op:name,...data})});
    const j=await r.json();
    if(j.error) throw j.error;
    if(!silent){close();await pull();}
    return j;
  }catch(e){
    toast("Cillad: "+e);
    throw e;
  }finally{
    if(!silent){setTimeout(()=>t.classList.remove("on"),400);}
  }
}

async function pull(showMsg){
  if(!API){setSync("init"); render(); return;}
  setSync("loading");
  try{
    const prevM=JSON.parse(JSON.stringify(S.m||[]));
    const prevAutoT=(S.t||[]).filter(it=>it.auto);
    const r=await fetch(API+(API.includes("?")?"&":"?")+"t="+Date.now());
    const j=await r.json();
    if(j.error) throw j.error;
    const norm=normalizeData(j);
    const changes=detectCellChanges(prevM,norm.m,norm.t);
    const mergedT=[...norm.t,...prevAutoT];
    changes.forEach(ch=>{
      const dup=mergedT.some(t=>t.w===ch.w&&t.b===ch.b&&t.nb===ch.nb&&+t.a===+ch.a);
      if(!dup) mergedT.push(ch);
    });
    S={m:norm.m,t:mergedT,x:norm.x};
    save();
    setSync("ok");
    if(showMsg) toast("✓ La cusboonaysiiyay");
  }catch(e){
    setSync("err",String(e).slice(0,60));
    if(showMsg) toast("Xiriirka Sheet lama gaadhin");
  }
  render();
}

function bind(){
  if(tab==="r"){
    const pGrp=$("#pGrp"); if(pGrp) pGrp.onchange=e=>{grpFilter=e.target.value;render();};
    const pSel=$("#pSel"); if(pSel) pSel.onchange=e=>{selPersonIdx=+e.target.value;render();};

    const wa=$("#waBtn"); if(wa) wa.onclick=()=>shareWhatsApp(sub);
    const pdf=$("#pdfBtn"); if(pdf) pdf.onclick=()=>downloadPdf(sub);
    const cp=$("#copyBtn"); if(cp) cp.onclick=()=>copyText(sub);

    $$(".tabs button[data-tab]").forEach(e=>e.onclick=()=>{sub=e.dataset.tab;render();});
  }
  if(tab==="m"){
    const gf=$("#gf"); if(gf) gf.onchange=e=>{grpFilter=e.target.value;render();};
    const qi=$("#q"); if(qi) qi.oninput=e=>{
      q=e.target.value; const p=e.target.selectionStart;
      render();
      const n=$("#q"); if(n){n.focus();n.setSelectionRange(p,p);}
    };
    $$("[data-action='edit-member']").forEach(e=>{
      e.onclick=()=>need(()=>em(+e.dataset.idx));
    });
  }
  if(tab==="t"){
    $$("[data-action='edit-collection']").forEach(e=>{
      e.onclick=()=>need(()=>openQuickCollection(+e.dataset.idx));
    });
  }
  if(tab==="x"){
    $$("[data-action='edit-expense']").forEach(e=>{
      e.onclick=()=>need(()=>ex(+e.dataset.idx));
    });
  }
}

$("#fab").onclick=()=>need(()=>{
  if(tab==="m") em(-1);
  else if(tab==="t") openQuickCollection(-1);
  else ex(-1);
});

render();
pull();
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && API) pull(); });
</script>
</body>
